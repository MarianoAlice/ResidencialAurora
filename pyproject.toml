[project]
name = "residencial-aurora"
version = "1.0.0"
description = "Assistente do Residencial Aurora"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "google-adk[db]==2.13.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
aurora-api = "aurora.cli:servir"
aurora-restaurar = "aurora.cli:restaurar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]
